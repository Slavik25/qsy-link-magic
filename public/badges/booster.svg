<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgG" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#b94cf4"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </radialGradient>
    <radialGradient id="coreG" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="60%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#a21caf"/>
    </radialGradient>
    <linearGradient id="rocketBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="flameG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="40%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer ring (boost glow) -->
  <circle cx="60" cy="60" r="58" fill="none" stroke="#d946ef" stroke-width="1.5" opacity="0.4"/>
  <circle cx="60" cy="60" r="54" fill="none" stroke="#f0abfc" stroke-width="0.8" opacity="0.25"/>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="52" fill="url(#bgG)"/>

  <!-- Inner shine -->
  <ellipse cx="60" cy="30" rx="30" ry="14" fill="white" opacity="0.08"/>

  <!-- Rocket body -->
  <path d="M60 18 C52 30 48 46 48 58 L60 64 L72 58 C72 46 68 30 60 18Z" fill="url(#rocketBody)" filter="url(#glow)"/>

  <!-- Rocket nose highlight -->
  <path d="M60 18 C57 24 55 30 55 38 L60 40 L65 38 C65 30 63 24 60 18Z" fill="white" opacity="0.35"/>

  <!-- Rocket window -->
  <circle cx="60" cy="50" r="6" fill="#1e0a2e" stroke="#f0abfc" stroke-width="1.5"/>
  <circle cx="58" cy="48" r="2" fill="white" opacity="0.6"/>

  <!-- Left fin -->
  <path d="M48 58 L40 70 L48 67Z" fill="#c026d3" opacity="0.9"/>
  <path d="M48 58 L40 70 L44 64Z" fill="#e879f9" opacity="0.5"/>

  <!-- Right fin -->
  <path d="M72 58 L80 70 L72 67Z" fill="#c026d3" opacity="0.9"/>
  <path d="M72 58 L80 70 L76 64Z" fill="#e879f9" opacity="0.5"/>

  <!-- Exhaust flame -->
  <path d="M52 64 Q56 78 60 86 Q64 78 68 64Z" fill="url(#flameG)" opacity="0.9"/>
  <path d="M55 64 Q58 74 60 80 Q62 74 65 64Z" fill="#fef3c7" opacity="0.7"/>

  <!-- Sparkles around rocket -->
  <!-- Top-left sparkle -->
  <g filter="url(#glow)" opacity="0.9">
    <line x1="26" y1="26" x2="26" y2="32" stroke="#f0abfc" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="23" y1="29" x2="29" y2="29" stroke="#f0abfc" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Top-right sparkle -->
  <g filter="url(#glow)" opacity="0.9">
    <line x1="90" y1="24" x2="90" y2="29" stroke="#e879f9" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="87.5" y1="26.5" x2="92.5" y2="26.5" stroke="#e879f9" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <!-- Right side sparkle -->
  <g filter="url(#glow)" opacity="0.8">
    <line x1="96" y1="50" x2="96" y2="55" stroke="#d946ef" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="93.5" y1="52.5" x2="98.5" y2="52.5" stroke="#d946ef" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Bottom-left sparkle -->
  <g filter="url(#glow)" opacity="0.7">
    <line x1="28" y1="72" x2="28" y2="76" stroke="#f0abfc" stroke-width="1" stroke-linecap="round"/>
    <line x1="26" y1="74" x2="30" y2="74" stroke="#f0abfc" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Small star dots -->
  <circle cx="38" cy="42" r="1.5" fill="#f0abfc" opacity="0.8"/>
  <circle cx="86" cy="38" r="1.2" fill="#e879f9" opacity="0.7"/>
  <circle cx="34" cy="80" r="1" fill="#d946ef" opacity="0.6"/>
  <circle cx="92" cy="76" r="1.2" fill="#f0abfc" opacity="0.7"/>
  <circle cx="45" cy="94" r="1" fill="#e879f9" opacity="0.5"/>
  <circle cx="78" cy="92" r="1.2" fill="#d946ef" opacity="0.6"/>

  <!-- "2x" boost label at bottom -->
  <rect x="42" y="90" width="36" height="16" rx="8" fill="#3b0764" opacity="0.85"/>
  <rect x="42" y="90" width="36" height="16" rx="8" fill="none" stroke="#d946ef" stroke-width="1" opacity="0.7"/>
  <text x="60" y="101.5" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="9" fill="#f0abfc" letter-spacing="1">2× BOOST</text>
</svg>
